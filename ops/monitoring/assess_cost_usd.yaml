# Log-based metric: estimated Gemini cost per /assess request in US dollars.
# Requests served by the fallback template have no cost and are excluded.
# Create with:
#   gcloud logging metrics create assess_cost_usd --config-from-file=ops/monitoring/assess_cost_usd.yaml
description: Estimated Gemini cost per /assess request, in US dollars.
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="regulatory-copilot" AND jsonPayload.event="assess_request" AND jsonPayload.est_cost_usd>0
valueExtractor: EXTRACT(jsonPayload.est_cost_usd)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 30
    growthFactor: 1.5
    scale: 0.0001
