# Log-based metric: count of /assess requests, labelled by outcome (ok, degraded, error).
# Error rate = (degraded + error) / all.
# Create with:
#   gcloud logging metrics create assess_requests --config-from-file=ops/monitoring/assess_requests.yaml
description: Count of /assess requests by outcome (ok, degraded, error).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="regulatory-copilot" AND jsonPayload.event="assess_request"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: outcome
      valueType: STRING
      description: ok, degraded or error
labelExtractors:
  outcome: EXTRACT(jsonPayload.outcome)
