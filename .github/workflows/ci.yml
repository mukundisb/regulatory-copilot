name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation OIDC token minting

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest tests/ -v

  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: "regulatory-copilot-506507"
      REGION: "asia-south1"
      SERVICE_NAME: "regulatory-copilot"
      IMAGE_BASE: "asia-south1-docker.pkg.dev/regulatory-copilot-506507/regulatory-copilot/regulatory-copilot"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Cloud Run Target Image
        run: |
          docker build \
            --target cloudrun \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            .

      - name: Push Container Images to Artifact Registry
        run: |
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_BASE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --memory=2Gi \
            --cpu=2 \
            --allow-unauthenticated \
            --format="value(status.url)")
          
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          echo "Deployed to: ${SERVICE_URL}"

      - name: Post-Deploy Verification (/health)
        run: |
          echo "Verifying deployment at ${SERVICE_URL}/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 3 --retry-connrefused "${SERVICE_URL}/health")
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi
          
          echo "Health check passed with HTTP 200. Verification complete."